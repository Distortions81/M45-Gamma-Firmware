name: Web Flasher Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual Pages publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web flasher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build web flasher package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            scripts/docker-web-flasher.sh --version "$PACKAGE_VERSION"
          else
            scripts/docker-web-flasher.sh
          fi
          mv dist/web-flasher site

      - name: Sync release firmware mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tools/sync_web_flasher_releases.py --site-dir site --board-version 602

      - name: Validate web flasher package
        run: |
          test -f site/index.html
          test -f site/firmware-releases.json
          test -f site/canonical-releases.json
          test -f site/esp-miner.bin
          test ! -e site/manifest.json
          test ! -e site/bootloader.bin
          test ! -e site/partition-table.bin
          shopt -s nullglob
          firmware=(site/esp-miner-factory-602-*.bin)
          test "${#firmware[@]}" -ge 1
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path("site/canonical-releases.json").read_text())
          canonical_releases = canonical.get("releases") or []
          if len(canonical_releases) != 1:
              raise SystemExit("canonical manifest must contain exactly one latest release")
          canonical_path = Path("site") / canonical_releases[0].get("ota_path", "")
          if canonical_path != Path("site/esp-miner.bin") or not canonical_path.is_file():
              raise SystemExit("canonical manifest must point to site/esp-miner.bin")

          manifest = json.loads(Path("site/firmware-releases.json").read_text())
          releases = manifest.get("releases") or []
          if not releases:
              raise SystemExit("release manifest has no firmware entries")
          for release in releases:
              path = Path("site") / release["path"]
              if not path.exists():
                  raise SystemExit(f"missing firmware listed in manifest: {path}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
