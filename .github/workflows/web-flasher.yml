name: Web Flasher Pages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual web flasher build
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web flasher package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware and web flasher package
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            scripts/docker-web-flasher.sh --version "$PACKAGE_VERSION"
          else
            scripts/docker-web-flasher.sh
          fi

      - name: Archive web flasher package
        run: tar -czf m45-web-flasher.tar.gz -C dist web-flasher

      - name: Upload web flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: m45-web-flasher
          path: dist/web-flasher
          if-no-files-found: error

      - name: Upload web flasher archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: m45-web-flasher-archive
          path: m45-web-flasher.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/web-flasher/index.html \
            dist/web-flasher/manifest.json \
            dist/web-flasher/m45-gamma-firmware.bin \
            m45-web-flasher.tar.gz \
            --clobber

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-flasher

  deploy:
    name: Deploy web flasher
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
