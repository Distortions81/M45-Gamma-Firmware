name: Build & Release Firmware

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual web flasher build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web flasher package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware and web flasher package
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            scripts/docker-web-flasher.sh --version "$PACKAGE_VERSION"
          else
            scripts/docker-web-flasher.sh
          fi

      - name: Upload web flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: m45-web-flasher
          path: dist/web-flasher
          if-no-files-found: error

      - name: Upload firmware release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          firmware="$(find dist/web-flasher -maxdepth 1 -type f -name 'esp-miner-factory-602-*.bin' -print -quit)"
          test -n "$firmware"
          test -f dist/web-flasher/esp-miner.bin
          gh release upload "$RELEASE_TAG" \
            dist/web-flasher/esp-miner.bin \
            "$firmware" \
            --clobber
