name: Build Canonical Firmware Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual web flasher build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web flasher package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware and web flasher package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            scripts/docker-web-flasher.sh --version "$PACKAGE_VERSION"
          else
            scripts/docker-web-flasher.sh
          fi

      - name: Upload web flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: m45-web-flasher
          path: dist/web-flasher
          if-no-files-found: error
