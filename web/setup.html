<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>M45 Setup</title><link rel=icon type=image/svg+xml href=/favicon.svg>{{GLOBAL_STYLES}}</head><body class=setup-page><main><header><h1>M45 Setup</h1><p id=setup-meta class=meta>Loading...</p></header>
<form id=setup-form novalidate><section class='panel scan-panel'><div class=scan-head><div>
<div class=scan-title>Wi-Fi networks</div><span id=scan-status class='scan-status scanning'>Scanning for networks...</span>
</div><button id=scan class=secondary type=button>Rescan for Wi-Fi</button></div><ul id=networks class=networks></ul>
<div id=network-more></div></section><section class=panel><div class=fields>
<div class='field full'><label for=wifi-ssid>Network name</label><input id=wifi-ssid autocomplete=ssid required></div>
<div class='field full'><label for=wifi-pass>Password</label><input id=wifi-pass type=password autocomplete=current-password></div>
</div><div class=hint>Choose a network above, or enter one manually.</div>
<div class=actions><button id=wifi-test class=secondary type=button disabled>Test Connection</button>
<button id=save class=primary type=submit disabled>Save &amp; Reboot</button>
<span id=status class=status></span></div></section><details class=panel><summary>Mining Pool</summary><div class=inside><div class=fields>
<div class=field><label for=pool-host>Pool</label><input id=pool-host required></div>
<div class=field><label for=pool-port>Port</label><input id=pool-port type=number min=1 max=65535 required></div>
<label class=toggle-row for=pool-tls><input id=pool-tls type=checkbox><span class=label>TLS</span></label>
<div class='field full'><label for=pool-user>Username (wallet.workername)</label><input id=pool-user required></div>
<div class=field><label for=pool-pass>Password (Optional, normally just 'x')</label><input id=pool-pass type=password></div>
<label class=toggle-row for=pool-diff-auto><input id=pool-diff-auto type=checkbox checked><span class=label>Auto Difficulty</span></label>
<div id=pool-diff-field class=field><label for=pool-diff>Difficulty</label><input id=pool-diff type=number min=1 max=65535></div>
</div><div class=hint>Wallet is taken from Username before the first dot.</div></div></details>
</form></main><script>
const $=id=>document.getElementById(id);
const set=(id,v)=>{$(id).value=v==null?'':v};
let wifiTestPassed=false,wifiTestKey='',wifiTesting=false;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function wifiKey(){return `${$('wifi-ssid').value.trim()}\n${$('wifi-pass').value}`}
function wifiReady(){return wifiTestPassed&&wifiTestKey===wifiKey()}
function setSaveEnabled(){const has=!!$('wifi-ssid').value.trim();$('wifi-test').disabled=wifiTesting||!has;$('save').disabled=!has||!wifiReady()}
function status(t,c=''){$('status').className=`status ${c}`.trim();$('status').textContent=t}
function resetWifiTest(msg=''){wifiTestPassed=false;wifiTestKey='';setSaveEnabled();if(msg)status(msg)}
async function testWifi(){const ssid=$('wifi-ssid').value.trim();if(!ssid){resetWifiTest('Enter a network name.');return}
const btn=$('wifi-test');wifiTesting=true;wifiTestPassed=false;setSaveEnabled();btn.textContent='Testing...';status('testing Wi-Fi...');
try{const body={wifi_ssid:ssid,wifi_password:$('wifi-pass').value};
let r=await fetch('/api/wifi-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let j=await r.json().catch(()=>({error:r.status}));if(!r.ok)throw new Error(j.error||r.status);
for(let i=0;j.running&&i<50;i++){await delay(800);r=await fetch(`/api/wifi-test?id=${j.id}`,{cache:'no-store'});
j=await r.json().catch(()=>({error:r.status}));if(!r.ok)throw new Error(j.error||r.status)}
if(j.running)throw new Error('connection timed out');if(!j.ok)throw new Error(j.error||'connection failed');
wifiTestPassed=true;wifiTestKey=wifiKey();status(`Wi-Fi test passed${j.ip?` (${j.ip})`:''}.`,'ok')}
catch(e){wifiTestPassed=false;wifiTestKey='';status(`Wi-Fi test failed: ${e.message||e}`,'err')}
finally{wifiTesting=false;btn.textContent='Test Connection';setSaveEnabled()}}
function syncPoolDiff(){const input=$('pool-diff'),auto=$('pool-diff-auto').checked;
if(auto){if(input.value)input.dataset.manual=input.value;input.value=input.dataset.auto||input.value||1000}
else if(input.dataset.manual)input.value=input.dataset.manual;input.disabled=auto}
function scrollToControl(el){try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){el.scrollIntoView()}}
function selectNetwork(n,li){document.querySelectorAll('.networks li').forEach(x=>x.classList.remove('selected'));
li.classList.add('selected');set('wifi-ssid',n.ssid);if(n.auth_open)$('wifi-pass').value='';
resetWifiTest(n.auth_open?'Test connection before saving.':'Enter password, then test connection.');const target=n.auth_open?$('wifi-test'):$('wifi-pass');
scrollToControl(target);setTimeout(()=>{target.focus();if(target.select)target.select()},150)}
function signalInfo(rssi){rssi=Number(rssi);if(rssi>=-50)return{label:'Excellent',cls:'signal-excellent'};
if(rssi>=-60)return{label:'Good',cls:'signal-good'};if(rssi>=-70)return{label:'Fair',cls:'signal-fair'};
if(rssi>=-80)return{label:'Weak',cls:'signal-weak'};return{label:'Poor',cls:'signal-poor'}}
function networkItem(n){const li=document.createElement('li');const left=document.createElement('div');
const name=document.createElement('strong');name.textContent=n.ssid||'(hidden network)';const meta=document.createElement('div');
meta.className='network-meta';meta.textContent=`${n.auth_open?'No password':'Password required'} | Channel ${n.channel}`;
left.appendChild(name);left.appendChild(meta);const info=signalInfo(n.rssi);const right=document.createElement('div');
right.className=`signal ${info.cls}`;const bars=document.createElement('div');bars.className='signal-bars';
for(let i=0;i<5;i++)bars.appendChild(document.createElement('span'));const label=document.createElement('strong');
label.textContent=info.label;const detail=document.createElement('small');detail.textContent=`${n.rssi} dBm`;
right.appendChild(bars);right.appendChild(label);right.appendChild(detail);li.appendChild(left);li.appendChild(right);
li.onclick=()=>{if(n.ssid)selectNetwork(n,li)};return li}
function renderNetworks(items){const list=$('networks');const more=$('network-more');list.innerHTML='';more.innerHTML='';
if(!items.length){const li=document.createElement('li');li.className='empty';li.textContent='No networks found.';list.appendChild(li);return}
items.slice(0,3).forEach(n=>list.appendChild(networkItem(n)));const hidden=items.slice(3);if(hidden.length){
const fold=document.createElement('details');fold.className='network-more';const summary=document.createElement('summary');
summary.textContent=`Show ${hidden.length} more`;const extra=document.createElement('ul');extra.className='networks';
hidden.forEach(n=>extra.appendChild(networkItem(n)));fold.appendChild(summary);fold.appendChild(extra);more.appendChild(fold)}}
async function scan(){const b=$('scan'),s=$('scan-status'),list=$('networks'),more=$('network-more');b.disabled=true;
s.className='scan-status scanning';s.textContent='Scanning for networks...';list.innerHTML='<li class=empty>Looking for nearby Wi-Fi networks...</li>';more.innerHTML='';
try{let j=null;for(let i=0;i<20;i++){const r=await fetch(`/api/networks${i===0?'?refresh=1':''}`,{cache:'no-store'});
j=await r.json();if(!r.ok)throw new Error(j.error||r.status);if(!j.scanning)break;await delay(700)}
if(j&&j.scanning)throw new Error('scan timed out');
const networks=j.networks||[];renderNetworks(networks);const visible=Math.min(networks.length,3);
s.className='scan-status';s.textContent=networks.length?`Showing ${visible} of ${networks.length} networks.`:'No networks found.'}
catch(e){s.className='scan-status';s.textContent=`Scan failed. Try again. ${e.message||e}`}finally{b.disabled=false}}
async function load(){try{const r=await fetch('/api/setup',{cache:'no-store'});
const s=await r.json();if(!r.ok)throw new Error(s.error||r.status);
$('setup-meta').textContent=`Network ${s.setup_ssid||'--'} | Address ${s.setup_ip||'--'}`;
set('wifi-ssid',s.wifi_ssid);set('pool-host',s.pool_host);set('pool-port',s.pool_port||3333);
$('pool-tls').checked=!!s.pool_tls;
set('pool-user',s.pool_user);$('pool-diff').dataset.manual=s.pool_difficulty||1000;
$('pool-diff').dataset.auto=s.pool_suggested_difficulty||s.pool_difficulty||1000;set('pool-diff',s.pool_difficulty||1000);
$('pool-diff-auto').checked=s.pool_difficulty_auto!==false;syncPoolDiff();
$('pool-pass').placeholder=s.pool_password_set?'Saved password':'x';
resetWifiTest(s.wifi_ssid?'Test connection before saving.':'');scan()}
catch(e){status(`setup load failed: ${e.message||e}`,'err')}}
$('setup-form').onsubmit=async e=>{e.preventDefault();if(!wifiReady()){status('test Wi-Fi connection before saving','err');setSaveEnabled();return}
const btn=$('save');btn.disabled=true;status('saving...');
const body={wifi_ssid:$('wifi-ssid').value.trim(),wifi_password:$('wifi-pass').value,
pool_host:$('pool-host').value.trim(),pool_port:Number($('pool-port').value),
pool_tls:$('pool-tls').checked,
pool_user:$('pool-user').value.trim(),pool_difficulty_auto:$('pool-diff-auto').checked,
pool_difficulty:Number(($('pool-diff-auto').checked?$('pool-diff').dataset.manual:$('pool-diff').value)||1000)};
if($('pool-pass').value)body.pool_pass=$('pool-pass').value;
try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const j=await r.json().catch(()=>({error:r.status}));if(!r.ok)throw new Error(j.error||r.status);
status('Saved, rebooting...','ok');btn.textContent='Rebooting...'}catch(e){setSaveEnabled();status(`save failed: ${e.message||e}`,'err')}};
$('scan').onclick=scan;$('wifi-test').onclick=testWifi;$('wifi-ssid').oninput=()=>resetWifiTest('Test connection before saving.');
$('wifi-pass').oninput=()=>resetWifiTest($('wifi-ssid').value.trim()?'Test connection before saving.':'');$('pool-diff').oninput=e=>{e.currentTarget.dataset.manual=e.currentTarget.value};
$('pool-diff-auto').onchange=syncPoolDiff;syncPoolDiff();load();</script></body></html>
