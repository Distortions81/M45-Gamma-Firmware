<section id=stats-boxes-view class=grid>
<article class=panel><div class=metric-head><div class=label>ASIC Temp</div><span id=asic-temp-state class=pill>--</span></div>
<div class=value><span id=asic-temp>--</span><span class=unit>C</span></div>
<div id=asic-temp-bar class=bar><span class=zone></span><span class=fill></span><span id=asic-temp-tick class=tick style='left:80%' title='62C target'></span></div><p id=asic-temp-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>VR Temp</div><span id=vr-temp-state class=pill>--</span></div>
<div class=value><span id=vr-temp>--</span><span class=unit>C</span></div>
<div id=vr-temp-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:32.2%' title='59C'></span></div><p id=vr-temp-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>Input Voltage</div><span id=vin-state class=pill>--</span></div>
<div class=value><span id=vin>--</span><span class=unit>V</span></div>
<div id=vin-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:50%' title='5V'></span></div><p id=vin-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>ASIC Voltage</div><span id=vout-state class=pill>--</span></div>
<div class=value><span id=vout>--</span><span class=unit>V</span></div>
<div id=vout-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:50%' title='1.150V'></span></div><p id=vout-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>ASIC Watts</div><span id=watts-state class=pill>--</span></div>
<div class=value><span id=watts>--</span><span class=unit>W</span></div>
<div id=watts-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:10.25%' title='14.1W'></span></div><p id=watts-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>Current</div><span id=iout-state class=pill>--</span></div>
<div class=value><span id=iout>--</span><span class=unit>A</span></div>
<div id=iout-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:11.5%' title='12.3A'></span></div><p id=iout-range class=range>--</p></article>
<article class=panel><div class=metric-head><div class=label>Fan</div><span id=fan-state class=pill>--</span></div>
<div class=value-row><div class=value><span id=fan>--</span><span class=unit>%</span></div><div id=fan-rpm class=subvalue>-- RPM</div></div>
<div id=fan-bar class=bar><span class=zone></span><span class=fill></span><span class=tick style='left:57%' title='57%'></span></div>
<p id=fan-range class=range><span id=fanrpm>--</span> RPM - expected 100% fixed</p></article>
<article class=panel><div class=metric-head><div class=label>Hashrate Average</div><span id=hashrate-state class=pill>--</span></div>
<div class=value-row><div class=value><span id=hashrate>--</span><span id=hashrate-unit class=unit></span></div>
<div id=hashrate-note class='subvalue hidden'></div></div>
<div id=hashrate-bar class=bar><span class=zone></span><span class=fill></span><span id=hashrate-loss class=loss></span><span class=tick style='left:44%' title='1.1 TH/s'></span></div><p id=hashrate-range class=range>--</p></article>
</section>
