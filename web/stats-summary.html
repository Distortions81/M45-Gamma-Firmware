<article class='panel full summary-panel'><div class=summary-sections>
<section class=summary-section><div class=summary-section-title>System</div><div class=summary-grid>
<section class=summary-item><div class=summary-label>ASIC</div><div id=asic-model class=summary-value>--</div></section>
<section class=summary-item><div class=summary-label>Clock</div><div id=asic-clock class=summary-value>--</div></section>
<section class=summary-item><div class=summary-label>Wi-Fi</div><div id=wifi class='summary-value stack-value'><span id=wifi-state>--</span><span id=wifi-rssi class=stack-sub></span></div></section>
<section class=summary-item><div class=summary-label>IP</div><div id=set-ip class=summary-value>--</div></section></div>
<dl class='mini-list summary-list'><dt>Hardware</dt><dd id=set-hardware>--</dd><dt>TPS</dt><dd id=tps-model>--</dd>
<dt>Build</dt><dd id=build-id>--</dd>
<dt>Built</dt><dd id=build-time>--</dd><dt id=issue-label class=hidden>Issue</dt><dd id=issue class=hidden>--</dd></dl></section>
<section class=summary-section><div class=summary-section-title>Pool</div><div class=summary-grid>
<section class=summary-item><div class=summary-label>Stratum</div><div id=pool class='summary-value stack-value'><span class=status-line><span id=stratum-dot class=status-dot></span><span id=stratum-state>--</span><span id=stratum-time class=status-time></span></span></div></section>
<section class=summary-item><div class=summary-label>Payout</div><div class=summary-value><span id=payout>--</span></div></section>
<section class=summary-item><div class=summary-label>Best Diff</div><div class='summary-value inline-value'><span id=best>--</span>
<button id=best-reset class=icon-btn type=button title='Reset best diff' aria-label='Reset best diff'>&#8635;</button></div></section>
<section class=summary-item><div class=summary-label>Response</div><div id=stratum-response class=summary-value>--</div></section></div>
<dl class='mini-list summary-list'><dt>Pool</dt><dd id=stratum-pool class='stack-sub system-pool'>--</dd>
<dt>Difficulty</dt><dd id=difficulty>--</dd><dt>Shares/min</dt><dd id=shares-min>--</dd>
<dt>Accepted</dt><dd id=accepted>--</dd><dt>Rejected</dt><dd id=rejected>--</dd></dl></section>
<section class=summary-section><div class=summary-section-title>ASIC Results</div><div class=summary-grid>
<section class=summary-item><div class=summary-label>Expected</div><div id=expected-hashrate class=summary-value>--</div></section>
<section class=summary-item><div class=summary-label>Corrupted Hashes</div><div id=nonce-errors class=summary-value>--</div></section>
<section class=summary-item><div class=summary-label>Error Rate</div><div id=nonce-error-rate class=summary-value>--</div></section>
<section class=summary-item><div class=summary-label>Error Loss</div><div id=hash-lost class=summary-value>--</div></section>
<section class='summary-item domain-map-item'><div class=summary-label>Domains</div><div id=domain-hashrate class=summary-value>--</div><div id=domain-grid class=domain-grid></div></section>
</div></section></div></article>
